services:
  weather-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather-app-container
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    volumes:
      - ./public:/app/public:ro
      - ./views:/app/views:ro
    networks:
      - weather-network

networks:
  weather-network:
    driver: bridge
